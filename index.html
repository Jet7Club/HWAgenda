<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0e"><link rel="manifest" href="./manifest.json"><title>Agenda HW</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f4f1e8;font:15px system-ui,Arial}header{position:sticky;top:0;background:#101318;border-bottom:1px solid #343a42;padding:14px 20px;z-index:3}.wrap{max-width:1180px;margin:auto}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;color:#dfbd61;letter-spacing:.08em;font-size:19px}.sp{flex:1}button,select,input{background:#181d23;color:#f4f1e8;border:1px solid #3a414b;border-radius:9px;padding:9px}button{cursor:pointer}.gold{background:#dfbd61;color:#111;font-weight:800}.active{border-color:#dfbd61;color:#dfbd61}main{padding:20px}.panel{background:#13171c;border:1px solid #303640;border-radius:16px;padding:16px;margin-bottom:14px}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.day h3{margin:0 0 10px;color:#dfbd61}.task{padding:10px;border:1px solid #303640;border-radius:11px;margin:7px 0;background:#181d23}.task.done{opacity:.5}.meta{font-size:12px;color:#aeb5be;margin-top:4px}.UI{border-left:5px solid #d44}.UNI{border-left:5px solid #e89b3c}.INU{border-left:5px solid #45aeb0}.NUNI{border-left:5px solid #777}.form{display:grid;grid-template-columns:2fr repeat(6,1fr);gap:8px}.hidden{display:none}@media(max-width:850px){.days{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.form input:first-child{grid-column:1/-1}}@media print{header,.editor,.tools{display:none!important}body{background:#fff;color:#111}.panel,.task{background:#fff;color:#111}}
</style></head><body><header><div class="wrap row"><div class="brand">AGENDA HW · V4.2</div><div class="sp"></div><button id="lang-fr" onclick="setLang('fr')">FR</button><button id="lang-en" onclick="setLang('en')">EN</button><button id="lang-es" onclick="setLang('es')">ES</button></div></header><main class="wrap">
<div class="panel editor"><div class="row"><b id="formTitle">Nouvelle tâche</b><div class="sp"></div><span id="sync">Local</span></div><div class="form" style="margin-top:10px">
<input id="title" placeholder="Tâche"><input id="date" type="date"><input id="time" type="time" step="60"><select id="dur"><option value="5">5 min</option><option value="15">15 min</option><option value="30">30 min</option><option value="45">45 min</option><option value="60" selected>1H</option><option value="90">1H30</option><option value="120">2H</option><option value="180">3H</option><option value="240">4H</option><option value="300">5H</option></select><select id="quad"><option>UI</option><option>UNI</option><option>INU</option><option>NUNI</option></select><select id="scope"><option>PERSO</option><option>PRO</option></select><select id="imp"></select>
<select id="freq"><option value="once">Ponctuelle</option><option value="daily">Chaque jour</option><option value="weekly">Chaque semaine</option><option value="monthly">Chaque mois</option><option value="quarterly">Tous les 3 mois</option><option value="semiannual">Tous les 6 mois</option><option value="annual">Tous les 12 mois</option></select><input id="endDate" type="date" title="Date de fin facultative"></div><div class="row" style="margin-top:10px"><button class="gold" onclick="saveTask()">Enregistrer</button><button onclick="cancelEdit()">Annuler</button></div></div>
<div class="panel tools"><div class="row"><button id="range-3" onclick="setRange(3)">3j</button><button id="range-7" onclick="setRange(7)">7j</button><button id="range-10" onclick="setRange(10)">10j</button><button onclick="print()">PDF PRO</button><button onclick="backup()">Sauvegarde JSON</button><label><button onclick="document.getElementById('file').click()">Import</button><input id="file" class="hidden" type="file" accept=".json" onchange="restore(this)"></label><button onclick="githubLoad()">↓ Charger GitHub</button><div class="sp"></div><span id="count"></span></div></div>
<div id="days" class="days"></div></main>
<script src="./github-config.js"></script><script>
const KEY='agenda.data.permanent',TR='agenda.data.permanent.trash';let tasks=JSON.parse(localStorage.getItem(KEY)||'[]'),trash=JSON.parse(localStorage.getItem(TR)||'[]'),editId=null,range=3,lang=localStorage.getItem('agenda.language')||'en';
for(let i=10;i>=1;i--)imp.innerHTML+=`<option value="${i}" ${i==5?'selected':''}>Importance ${i}/10</option>`;
const T={fr:{new:'Nouvelle tâche',save:'Enregistrer',todo:'À faire'},en:{new:'New task',save:'Save',todo:'To do'},es:{new:'Nueva tarea',save:'Guardar',todo:'Por hacer'}};
function setLang(x){lang=x;localStorage.setItem('agenda.language',x);formTitle.textContent=T[x].new;['fr','en','es'].forEach(function(l){var b=document.getElementById('lang-'+l);if(b)b.classList.toggle('gold',l===x)});render()}
function setRange(n){range=n;[3,7,10].forEach(v=>{let b=document.getElementById('range-'+v);if(b)b.classList.toggle('gold',v===n)});render()} function iso(d){return d.toISOString().slice(0,10)} function add(d,n){let x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return iso(x)}
function business(d){let x=new Date(d+'T12:00');while([0,6].includes(x.getDay()))x.setDate(x.getDate()+1);return iso(x)}
function persist(){localStorage.setItem(KEY,JSON.stringify(tasks));localStorage.setItem(TR,JSON.stringify(trash))}
function saveTask(){if(!title.value.trim()||!date.value||!time.value)return alert('Titre, date et heure requis');let d=scope.value==='PRO'?business(date.value):date.value;let o={id:editId||Date.now(),title:title.value.trim(),original:d,planned:d,time:time.value,duration:+dur.value,quadrant:quad.value,scope:scope.value,importance:+imp.value,frequency:freq.value,endDate:endDate.value||'',doneDates:editId?(tasks.find(x=>x.id===editId)?.doneDates||[]):[]};let clash=tasks.find(x=>x.id!==editId&&x.planned===d&&x.time===o.time);if(clash&&!confirm('Conflit horaire avec « '+clash.title+' ». Enregistrer quand même ?'))return;if(editId)tasks=tasks.map(x=>x.id===editId?o:x);else tasks.push(o);persist();cancelEdit();render()}
function cancelEdit(){editId=null;title.value='';date.value=iso(new Date());time.value='10:00';dur.value=60;quad.value='UI';scope.value='PERSO';imp.value=5;freq.value='once';endDate.value='';formTitle.textContent=T[lang].new}
function edit(x){let t=tasks.find(a=>a.id===x);if(!t)return;editId=x;title.value=t.title;date.value=t.planned||t.original;time.value=t.time;dur.value=t.duration;quad.value=t.quadrant;scope.value=t.scope;imp.value=t.importance||5;freq.value=t.frequency||'once';endDate.value=t.endDate||'';scrollTo(0,0)}
function del(x){let t=tasks.find(a=>a.id===x);if(confirm('Supprimer « '+t.title+' » ?')){trash.push(t);tasks=tasks.filter(a=>a.id!==x);persist();render()}}
function occurs(t,d){let s=t.planned||t.original;if(d<s)return false;if(t.endDate&&d>t.endDate)return false;if(t.scope==='PRO'&&[0,6].includes(new Date(d+'T12:00').getDay()))return false;if(t.frequency==='once')return d===s;let a=new Date(s+'T12:00'),b=new Date(d+'T12:00'),dd=Math.round((b-a)/86400000);if(t.frequency==='daily')return true;if(t.frequency==='weekly')return dd%7===0;if(t.frequency==='monthly')return a.getDate()===b.getDate();if(t.frequency==='quarterly')return a.getDate()===b.getDate()&&((b.getMonth()-a.getMonth()+12*(b.getFullYear()-a.getFullYear()))%3===0);if(t.frequency==='semiannual')return a.getDate()===b.getDate()&&((b.getMonth()-a.getMonth()+12*(b.getFullYear()-a.getFullYear()))%6===0);if(t.frequency==='annual')return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();return false}
function done(id,d){let t=tasks.find(x=>x.id===id);t.doneDates=t.doneDates||[];let i=t.doneDates.indexOf(d);i<0?t.doneDates.push(d):t.doneDates.splice(i,1);persist();render()}
function render(){let start=iso(new Date()),ds=[];for(let n=0;n<range;n++)ds.push(add(start,n));days.innerHTML=ds.map(d=>{let list=tasks.filter(t=>occurs(t,d)).sort((a,b)=>({UI:0,UNI:1,INU:2,NUNI:3}[a.quadrant]-({UI:0,UNI:1,INU:2,NUNI:3}[b.quadrant])||(b.importance||5)-(a.importance||5)||a.time.localeCompare(b.time));return `<section class="panel day"><h3>${new Date(d+'T12:00').toLocaleDateString(lang,{weekday:'long',day:'numeric',month:'long'})}</h3>${list.length?list.map(t=>{let dn=(t.doneDates||[]).includes(d);return `<div class="task ${t.quadrant} ${dn?'done':''}"><div class="row"><input type="checkbox" ${dn?'checked':''} onchange="done(${t.id},'${d}')"><b>${esc(t.title)}</b><div class="sp"></div><b>${t.time}</b></div><div class="meta">${t.quadrant} · Importance ${t.importance||5}/10 · ${t.scope} · ${t.duration} min · ${t.frequency}</div><div class="row"><button onclick="edit(${t.id})">Modifier</button><button onclick="done(${t.id},'${d}')">Exécuté</button><button onclick="del(${t.id})">Supprimer</button></div></div>`}).join(''):'<div class="meta">—</div>'}</section>`}).join('');count.textContent=tasks.length+' tâches'}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function backup(){let b=new Blob([JSON.stringify({schema:'agenda-hw-v41',updatedAt:new Date().toISOString(),tasks,trash},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Agenda_HW_backup.json';a.click()}
function restore(i){let f=i.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);tasks=d.tasks||[];trash=d.trash||[];persist();render()}catch(e){alert('JSON invalide')}};r.readAsText(f)}
async function githubLoad(){try{sync.textContent='Chargement…';let u='./data/tasks.json?t='+Date.now();let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let d=await r.json();if(!Array.isArray(d.tasks))throw new Error('Format tasks.json invalide');if(tasks.length&&!confirm('Remplacer les tâches locales par les '+d.tasks.length+' tâches GitHub ?')){sync.textContent='Local';return;}tasks=d.tasks;trash=Array.isArray(d.trash)?d.trash:[];persist();sync.textContent='GitHub chargé · '+tasks.length+' tâches';render();}catch(e){sync.textContent='Erreur GitHub';alert('Chargement GitHub impossible : '+e.message)}}
async function preloadGitHub(){
  if(tasks.length){render();return;}
  try{
    let c=window.HWAGENDA_GITHUB||{};
    let u=`https://raw.githubusercontent.com/${c.owner||'Jet7Club'}/${c.repo||'HWAgenda'}/${c.branch||'main'}/${c.dataPath||'data/tasks.json'}?t=${Date.now()}`;
    let r=await fetch(u,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let d=await r.json();
    if(Array.isArray(d.tasks)){
      tasks=d.tasks;
      trash=Array.isArray(d.trash)?d.trash:[];
      persist();
      sync.textContent='Préchargé GitHub';
    }
  }catch(e){sync.textContent='Local';}
  render();
}
cancelEdit();setLang(lang);setRange(3);preloadGitHub();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=42').then(r=>r.update()).catch(()=>{});
</script></body></html>
