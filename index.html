<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0e"><link rel="manifest" href="./manifest.json"><title>Agenda HW</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#f4f1e8;font:15px system-ui,Arial}header{position:sticky;top:0;background:#101318;border-bottom:1px solid #343a42;padding:14px 20px;z-index:3}.wrap{max-width:1180px;margin:auto}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;color:#dfbd61;letter-spacing:.08em;font-size:19px}.sp{flex:1}button,select,input{background:#181d23;color:#f4f1e8;border:1px solid #3a414b;border-radius:9px;padding:9px}button{cursor:pointer}.gold{background:#dfbd61;color:#111;font-weight:800}.active{border-color:#dfbd61;color:#dfbd61}main{padding:20px}.panel{background:#13171c;border:1px solid #303640;border-radius:16px;padding:16px;margin-bottom:14px}.days{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.day h3{margin:0 0 10px;color:#dfbd61}.task{padding:10px;border:1px solid #303640;border-radius:11px;margin:7px 0;background:#181d23}.task.done{opacity:.5}.meta{font-size:12px;color:#aeb5be;margin-top:4px}.UI{border-left:5px solid #d44}.UNI{border-left:5px solid #e89b3c}.INU{border-left:5px solid #45aeb0}.NUNI{border-left:5px solid #777}.form{display:grid;grid-template-columns:2fr repeat(6,1fr);gap:8px}.hidden{display:none}@media(max-width:850px){.days{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.form input:first-child{grid-column:1/-1}}@media print{header,.editor,.tools{display:none!important}body{background:#fff;color:#111}.panel,.task{background:#fff;color:#111}}
</style><script src="https://accounts.google.com/gsi/client" async defer></script><script src="./google-config.js"></script></head><body><header><div class="wrap row"><div class="brand">AGENDA HW · V4.3</div><div class="sp"></div><button id="lang-fr" onclick="setLang('fr')">FR</button><button id="lang-en" onclick="setLang('en')">EN</button><button id="lang-es" onclick="setLang('es')">ES</button></div></header><main class="wrap">
<div class="panel editor"><div class="row"><b id="formTitle">Nouvelle tâche</b><div class="sp"></div><span id="sync">Local</span></div><div class="form" style="margin-top:10px">
<input id="title" placeholder="Tâche"><input id="date" type="date"><input id="time" type="time" step="60"><select id="dur"><option value="5">5 min</option><option value="15">15 min</option><option value="30">30 min</option><option value="45">45 min</option><option value="60" selected>1H</option><option value="90">1H30</option><option value="120">2H</option><option value="180">3H</option><option value="240">4H</option><option value="300">5H</option></select><select id="quad"><option>UI</option><option>UNI</option><option>INU</option><option>NUNI</option></select><select id="scope"><option>PERSO</option><option>PRO</option></select><select id="imp"></select>
<select id="freq"><option value="once">Ponctuelle</option><option value="daily">Chaque jour</option><option value="weekly">Chaque semaine</option><option value="monthly">Chaque mois</option><option value="quarterly">Tous les 3 mois</option><option value="semiannual">Tous les 6 mois</option><option value="annual">Tous les 12 mois</option></select><input id="endDate" type="date" title="Date de fin facultative"></div><div class="row" style="margin-top:10px"><button class="gold" onclick="saveTask()">Enregistrer</button><button onclick="cancelEdit()">Annuler</button></div></div>
<div class="panel tools"><div class="row"><button id="range-3" onclick="setRange(3)">3j</button><button id="range-7" onclick="setRange(7)">7j</button><button id="range-10" onclick="setRange(10)">10j</button><button onclick="print()">PDF PRO</button><button onclick="backup()">Sauvegarde JSON</button><label><button onclick="document.getElementById('file').click()">Import</button><input id="file" class="hidden" type="file" accept=".json" onchange="restore(this)"></label><button onclick="githubLoad()">↓ Charger GitHub</button><button id="googleBtn" onclick="googleConnect()">Connecter Google Calendar</button><button id="googleTestBtn" onclick="googleSendTest()" disabled>Test → Google</button><div class="sp"></div><span id="count"></span></div></div>
<div id="days" class="days"></div></main>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var titleEl=$("title"),dateEl=$("date"),timeEl=$("time"),durEl=$("dur"),quadEl=$("quad"),scopeEl=$("scope"),impEl=$("imp"),freqEl=$("freq"),endDateEl=$("endDate"),formTitleEl=$("formTitle"),syncEl=$("sync"),daysEl=$("days"),countEl=$("count");
var KEY="agenda.data.permanent",TR="agenda.data.permanent.trash",tasks=[],trash=[],editId=null,range=3,lang="en";
function load(k){try{var v=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(v)?v:[];}catch(e){return [];}}
tasks=load(KEY);trash=load(TR);try{lang=localStorage.getItem("agenda.language")||"en";}catch(e){}
for(var i=10;i>=1;i--){var o=document.createElement("option");o.value=i;o.textContent="Importance "+i+"/10";if(i===5)o.selected=true;impEl.appendChild(o);}
var TXT={fr:"Nouvelle tâche",en:"New task",es:"Nueva tarea"};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(tasks));localStorage.setItem(TR,JSON.stringify(trash));}catch(e){}}
function iso(d){var y=d.getFullYear(),m=("0"+(d.getMonth()+1)).slice(-2),da=("0"+d.getDate()).slice(-2);return y+"-"+m+"-"+da;}
function add(d,n){var x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return iso(x);}
function business(d){var x=new Date(d+"T12:00:00");while(x.getDay()===0||x.getDay()===6)x.setDate(x.getDate()+1);return iso(x);}
function esc(v){return String(v||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
window.setLang=function(x){lang=x;try{localStorage.setItem("agenda.language",x);}catch(e){} formTitleEl.textContent=TXT[x]||TXT.en;["fr","en","es"].forEach(function(l){var b=$("lang-"+l);if(b)b.classList.toggle("gold",l===x);});render();};
window.setRange=function(n){range=n;[3,7,10].forEach(function(v){var b=$("range-"+v);if(b)b.classList.toggle("gold",v===n);});render();};
function reset(){editId=null;titleEl.value="";dateEl.value=iso(new Date());timeEl.value="10:00";durEl.value="60";quadEl.value="UI";scopeEl.value="PERSO";impEl.value="5";freqEl.value="once";endDateEl.value="";formTitleEl.textContent=TXT[lang]||TXT.en;}
window.cancelEdit=reset;
window.saveTask=function(){if(!titleEl.value.trim()||!dateEl.value||!timeEl.value){alert("Titre, date et heure requis");return;}var d=scopeEl.value==="PRO"?business(dateEl.value):dateEl.value;var old=null,j;for(j=0;j<tasks.length;j++)if(tasks[j].id===editId)old=tasks[j];var o={id:editId||Date.now(),title:titleEl.value.trim(),original:old?old.original:d,planned:d,time:timeEl.value,duration:Number(durEl.value),quadrant:quadEl.value,scope:scopeEl.value,importance:Number(impEl.value),frequency:freqEl.value,endDate:endDateEl.value||"",doneDates:old&&old.doneDates?old.doneDates:[]};if(editId){for(j=0;j<tasks.length;j++)if(tasks[j].id===editId)tasks[j]=o;}else tasks.push(o);persist();reset();render();};
window.edit=function(id){for(var i=0;i<tasks.length;i++)if(tasks[i].id===id){var t=tasks[i];editId=id;titleEl.value=t.title;dateEl.value=t.planned||t.original;timeEl.value=t.time;durEl.value=String(t.duration);quadEl.value=t.quadrant;scopeEl.value=t.scope;impEl.value=String(t.importance||5);freqEl.value=t.frequency||"once";endDateEl.value=t.endDate||"";window.scrollTo(0,0);return;}};
window.del=function(id){var n=[];for(var i=0;i<tasks.length;i++){if(tasks[i].id===id)trash.push(tasks[i]);else n.push(tasks[i]);}tasks=n;persist();render();};
window.done=function(id,d){for(var i=0;i<tasks.length;i++)if(tasks[i].id===id){var a=tasks[i].doneDates||[],p=a.indexOf(d);if(p<0)a.push(d);else a.splice(p,1);tasks[i].doneDates=a;}persist();render();};
function occurs(t,d){var s=t.planned||t.original;if(d<s)return false;if(t.endDate&&d>t.endDate)return false;var wd=new Date(d+"T12:00:00").getDay();if(t.scope==="PRO"&&(wd===0||wd===6))return false;if(t.frequency==="once")return d===s;var a=new Date(s+"T12:00:00"),b=new Date(d+"T12:00:00"),dd=Math.round((b-a)/86400000),months=(b.getMonth()-a.getMonth())+12*(b.getFullYear()-a.getFullYear());if(t.frequency==="daily")return true;if(t.frequency==="weekly")return dd%7===0;if(t.frequency==="monthly")return a.getDate()===b.getDate();if(t.frequency==="quarterly")return a.getDate()===b.getDate()&&months%3===0;if(t.frequency==="semiannual")return a.getDate()===b.getDate()&&months%6===0;if(t.frequency==="annual")return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();return false;}
function render(){var start=iso(new Date()),html="",total=tasks.length;for(var n=0;n<range;n++){var d=add(start,n),list=[];for(var i=0;i<tasks.length;i++)if(occurs(tasks[i],d))list.push(tasks[i]);list.sort(function(a,b){var tm=String(a.time).localeCompare(String(b.time));if(tm)return tm;var q={UI:0,UNI:1,INU:2,NUNI:3},z=q[a.quadrant]-q[b.quadrant];return z||((b.importance||5)-(a.importance||5));});html+='<section class="panel day"><h3>'+new Date(d+"T12:00:00").toLocaleDateString(lang,{weekday:"long",day:"numeric",month:"long"})+"</h3>";if(!list.length)html+='<div class="meta">—</div>';for(i=0;i<list.length;i++){var t=list[i],dn=(t.doneDates||[]).indexOf(d)>=0;html+='<div class="task '+esc(t.quadrant)+(dn?' done':'')+'"><div class="row"><input type="checkbox" '+(dn?"checked":"")+' onchange="done('+t.id+",'"+d+"'"+')"><b>'+esc(t.title)+'</b><div class="sp"></div><b>'+esc(t.time)+'</b></div><div class="meta">'+esc(t.quadrant)+' · Importance '+(t.importance||5)+'/10 · '+esc(t.scope)+' · '+t.duration+' min · '+esc(t.frequency)+'</div><div class="row"><button onclick="edit('+t.id+')">Modifier</button><button onclick="done('+t.id+",'"+d+"'"+')">Exécuté</button><button onclick="del('+t.id+')">Supprimer</button></div></div>';}html+="</section>";}daysEl.innerHTML=html;countEl.textContent=total+" tâches";}
window.backup=function(){var b=new Blob([JSON.stringify({schema:"agenda-hw-v423",updatedAt:new Date().toISOString(),tasks:tasks,trash:trash},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Agenda_HW_backup.json";a.click();};
window.restore=function(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);tasks=Array.isArray(d.tasks)?d.tasks:[];trash=Array.isArray(d.trash)?d.trash:[];persist();render();}catch(e){alert("JSON invalide");}};r.readAsText(f);};
window.githubLoad=function(){syncEl.textContent="Chargement...";fetch("./data/tasks.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}).then(function(d){if(!Array.isArray(d.tasks))throw new Error("Format invalide");tasks=d.tasks;trash=Array.isArray(d.trash)?d.trash:[];persist();syncEl.textContent="GitHub chargé · "+tasks.length+" tâches";render();}).catch(function(e){syncEl.textContent="Erreur GitHub";alert(e.message);});};
var googleToken="",googleTokenClient=null;
window.googleConnect=function(){
  if(!window.HWAGENDA_GOOGLE||!window.HWAGENDA_GOOGLE.clientId){alert("Client ID Google manquant");return;}
  if(!window.google||!google.accounts||!google.accounts.oauth2){alert("Google Identity Services pas encore chargé. Réessaie dans quelques secondes.");return;}
  if(!googleTokenClient)googleTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:window.HWAGENDA_GOOGLE.clientId,
    scope:"https://www.googleapis.com/auth/calendar.events",
    callback:function(resp){
      if(resp.error){syncEl.textContent="Google : erreur";alert(resp.error);return;}
      googleToken=resp.access_token;
      syncEl.textContent="Google ✓ connecté";
      var b=$("googleBtn"),t=$("googleTestBtn");if(b)b.textContent="Google ✓ connecté";if(t)t.disabled=false;
    }
  });
  googleTokenClient.requestAccessToken({prompt:googleToken?"":"consent"});
};
window.googleSendTest=function(){
  if(!googleToken){alert("Connecte Google Calendar d’abord.");return;}
  var start=new Date(Date.now()+3600000);start.setMinutes(0,0,0);
  var end=new Date(start.getTime()+30*60000);
  var ev={summary:"Agenda HW — Test connexion",description:"Événement test créé depuis Agenda HW V4.3. Tu peux le supprimer après validation.",start:{dateTime:start.toISOString()},end:{dateTime:end.toISOString()}};
  fetch("https://www.googleapis.com/calendar/v3/calendars/primary/events",{method:"POST",headers:{"Authorization":"Bearer "+googleToken,"Content-Type":"application/json"},body:JSON.stringify(ev)})
  .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error((d.error&&d.error.message)||("HTTP "+r.status));return d;});})
  .then(function(d){syncEl.textContent="Google ✓ test créé";alert("Test Google Calendar créé avec succès.");})
  .catch(function(e){syncEl.textContent="Google : erreur";alert("Google Calendar : "+e.message);});
};
function preload(){if(tasks.length){render();return;}fetch("./data/tasks.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d.tasks)){tasks=d.tasks;trash=Array.isArray(d.trash)?d.trash:[];persist();syncEl.textContent="Préchargé GitHub";}render();}).catch(function(){syncEl.textContent="Local";render();});}
reset();window.setLang(lang);window.setRange(3);preload();
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});});}
})();
</script></body></html>
